<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Eusebio María Esono - DAM Student / Web Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B1A"/>
      <stop offset="1" stop-color="#1A1033"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8B5CF6" stroke-opacity="0.15" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Línea de escaneo -->
  <rect y="-60" width="1200" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;300" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Esquinas HUD -->
  <g fill="none" stroke="#A78BFA" stroke-width="3" stroke-linecap="round">
    <path d="M24 70V24H70"/>
    <path d="M1130 24H1176V70"/>
    <path d="M24 230V276H70"/>
    <path d="M1130 276H1176V230"/>
  </g>

  <!-- Estado del sistema -->
  <circle cx="52" cy="48" r="5" fill="#22D3EE">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="68" y="53" font-family="'Courier New', monospace" font-size="15" fill="#22D3EE" letter-spacing="3">SYSTEM://ONLINE</text>
  <text x="1150" y="53" font-family="'Courier New', monospace" font-size="15" fill="#A78BFA" letter-spacing="3" text-anchor="end">DAM · 2026</text>

  <!-- Nombre -->
  <text x="600" y="152" font-family="'Courier New', monospace" font-size="58" font-weight="bold" fill="url(#neon)" text-anchor="middle" filter="url(#glow)" letter-spacing="4">
    EUSEBIO MARÍA ESONO
  </text>

  <!-- Subtítulo -->
  <text x="600" y="203" font-family="'Courier New', monospace" font-size="21" fill="#C4B5FD" text-anchor="middle" letter-spacing="8">
    DAM STUDENT · WEB DEVELOPER
  </text>

  <!-- Línea inferior animada -->
  <line x1="200" y1="240" x2="1000" y2="240" stroke="url(#neon)" stroke-width="2" stroke-dasharray="12 8">
    <animate attributeName="stroke-dashoffset" values="0;-40" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <text x="600" y="268" font-family="'Courier New', monospace" font-size="14" fill="#8B5CF6" text-anchor="middle" letter-spacing="5">BUILD · LEARN · CREATE</text>
</svg>
